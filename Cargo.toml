[workspace]
members = ["crates/mogwai-md", "examples/demo"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Schell Scivally <efsubenovex@gmail.com>"]

[workspace.dependencies]
mogwai = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"

[workspace.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Window",
    "Node",
    "Text",
]

[profile.release]
opt-level = "z"
lto = true