[package]
name = "mogwai-md"
description = "A markdown rendering widget for mogwai"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/schell/mogwai-md"
homepage = "https://github.com/schell/mogwai-md"
documentation = "https://docs.rs/mogwai-md"
readme = "../../README.md"
keywords = ["markdown", "mogwai", "wasm", "dom", "pulldown"]
categories = ["gui", "web-programming", "text-processing"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
crate-type = ["rlib"]

[features]
default = []
wasm-test = ["dep:wasm-bindgen-test", "dep:console_log", "dep:console_error_panic_hook"]

[dependencies]
mogwai.workspace = true
pulldown-cmark.workspace = true
log.workspace = true
wasm-bindgen-test = { workspace = true, optional = true }
console_log = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen.workspace = true
web-sys.workspace = true